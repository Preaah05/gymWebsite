<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Priya Fitness</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <script
            src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
        <script>
                (function () {
                    emailjs.init("oxT1amCkXbQG4H2TT");
                })();
            </script>

        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Playfair Display', serif;
            background: url('Image/gym3.jpg') no-repeat center center/cover;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.6);
        }

        .left img {
            width: 100px;
            filter: invert(80%);
        }

        .left div {
            font-size: 22px;
            text-align: center;
            color: #d4d9e8;
        }

        .mid {
            flex: 1;
            text-align: center;
        }

        .navbar {
            list-style: none;
            padding: 0;
        }

        .navbar li {
            display: inline-block;
            margin: 0 10px;
        }

        .navbar li a {
            text-decoration: none;
            color: white;
            padding: 8px 16px;
            font-size: 18px;
        }

        .navbar li a:hover,
        .navbar li a.active {
            text-decoration: underline;
            color: #ff6666;
            font-weight: bold;
        }

        .right .btn {
            background-color: #000;
            color: white;
            border: 2px solid #888;
            border-radius: 10px;
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
        }

        .container h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 16px;
        }

        .container button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 18px;
            background-color: #000;
            color: white;
            border: 2px solid #888;
            border-radius: 10px;
        }

        .footer {
            background-color: #24262b;
            padding: 40px 20px;
            color: white;
            margin-top: 80px;
        }

        .footer .containerr {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .footer-col {
            flex: 1 1 200px;
            margin: 20px 0;
        }

        .footer-col h4 {
            margin-bottom: 15px;
        }

        .footer-col ul {
            list-style: none;
            padding: 0;
        }

        .footer-col ul li a {
            text-decoration: none;
            color: white;
            font-size: 14px;
        }

        .footer-col ul li a:hover {
            color: #ff6666;
        }

        .social-links a {
            color: white;
            font-size: 20px;
            margin-right: 15px;
        }

        .social-links a:hover {
            color: #ff6666;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: center;
            }

            .mid {
                margin: 20px 0;
            }

            .container {
                margin: 40px 20px;
                padding: 20px;
            }

            .footer .containerr {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
    </head>

    <body>

        <header class="header">
            <div class="left">
                <img src="Image/gym2.jpg" alt="Logo">
                <div>Flexfit</div>
            </div>

            <div class="mid">
                <ul class="navbar">
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="abtus.html">About Us</a></li>
                    <li><a href="calculator.html">Fitness Calculator</a></li>
                    <li><a href="https://www.google.com/gmail/about/">Contact
                            Us</a></li>
                </ul>
            </div>

            <div class="right">
                <button class="btn">Call Us Now</button>
                <button class="btn">Email Us</button>
            </div>
        </header>

        <div class="container">
            <h1>Join the best gym!</h1>
            <form action="#" id="contact-form">
                <div class="form-group">
                  <input type="text" name="name" placeholder="Enter your Name" required>
                </div>
                
                <div class="form-group">
                  <input type="text" name="age" placeholder="Enter your Age" required>
                </div>
                
                <div class="form-group">
                  <input type="text" name="gender" placeholder="Enter your Gender" required>
                </div>
                
                <div class="form-group">
                  <input type="text" name="locality" placeholder="Enter your Locality" required>
                </div>
                
                <div class="form-group">
                  <input type="text" name="phone" placeholder="Enter your Phone Number" required>
                </div>
                
                <div class="form-group">
                  <input type="email" name="email" placeholder="Enter your Email" required>
                </div>
              
                <div class="form-group">
                  <input type="text" name="title" placeholder="Subject" required>
                </div>
              
                <div class="form-group">
                  <textarea name="message" placeholder="Your Message" required></textarea>
                </div>
                
                <button class="btn" type="submit">Submit Now</button>
              </form>
              

        </div>

        <footer class="footer">
            <div class="containerr">
                <div class="footer-col">
                    <h4>Company</h4>
                    <ul>
                        <li><a href="service.html">Our Services</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4>Get Help</h4>
                    <ul>
                        <li><a href="payment.html">Payment Options</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4>Follow Us</h4>
                    <div class="social-links">
                        <a href="https://www.facebook.com/"><i
                                class="fab fa-facebook-f"></i></a>
                        <a href="https://twitter.com/"><i
                                class="fab fa-twitter"></i></a>
                        <a href="https://www.instagram.com/"><i
                                class="fab fa-instagram"></i></a>
                        <a
                            href="https://www.linkedin.com/in/priya-verma-954568293/"><i
                                class="fab fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </footer>
        <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
        <script>
  (function () {
    emailjs.init("oxT1amCkXbQG4H2TT");
  })();

  document.getElementById("contact-form").addEventListener("submit", function (e) {
    e.preventDefault();

    emailjs.sendForm("service_3g9aio7", "template_4gg8rlr", this)
      .then(() => {
        alert("Message sent successfully!");
      }, (error) => {
        alert("Failed to send message. Try again.");
        console.error("EmailJS Error:", error);
      });
  });
</script>
    </body>

</html>
